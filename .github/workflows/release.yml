name: Release

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  semantic-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Mints the short-lived OIDC token npm exchanges for publish rights. Without
      # it there is no credential at all: the job holds no npm token.
      #
      # npm's trusted-publisher record for @dwlf/indicators names this repository and
      # THIS FILE'S NAME, `release.yml`, matched exactly. Renaming it, or moving this
      # job into a called workflow under a different name, revokes publishing until
      # the record on npm is updated to match. See RELEASING.md.
      #
      # The permission is job-scoped: every step below can reach the ID-token
      # endpoint, which is why the install runs with --ignore-scripts.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # semantic-release 25 and @semantic-release/npm 13 require ^22.14.0 || >= 24.10.0.
      # Node 24.10+ bundles npm >= 11.6, which can publish over OIDC (>= 11.5.1);
      # the preflight below checks it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Every step here can exchange the ID token for publish rights on
      # @dwlf/indicators. --ignore-scripts removes dependency install scripts from
      # that set; the build toolchain and semantic-release's plugins still run with
      # it, as they do in dwlf-charting-oss.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check this tree can publish via trusted publishing
        run: node .github/scripts/check-trusted-publishing.mjs

      # semantic-release pushes the tag BEFORE publishing, and `npm publish` builds
      # through `prepublishOnly`. Building first turns a broken build into a failure
      # before any tag exists, instead of a stranded tag with nothing on npm.
      - name: Build
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release
